# Publishes the game every time changes are pushed to main:
# checks the scenarios, builds the website and puts it on the gh-pages branch,
# which GitHub Pages serves at https://kuroyamihz.github.io/beautiful-grind/
name: Publish game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check scenarios
        run: node tools/validate-scenarios.mjs
      - name: Play test careers (blocks publishing if anything breaks)
        run: node tools/sim-test.mjs 3
      - name: Build site
        run: node tools/build-site.mjs
      - name: Publish to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish game from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
